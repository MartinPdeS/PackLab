package:
  name: packlab
  version: 0.6.3

source:
  path: .

build:
  number: 0
  script:
    - export CXXFLAGS="${CXXFLAGS} -D_LIBCPP_DISABLE_AVAILABILITY"  # [osx]
    # conda-build exports a stale Visual Studio generator on the Windows runner.
    # CMake 4 no longer recognises it; clearing the variable lets CMake select
    # the installed Visual Studio toolchain.
    - set "CMAKE_GENERATOR="  # [win]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

channels:
  - conda-forge
  - martinpdes

requirements:
  build:
    - {{ compiler('cxx') }}
    - llvm-openmp  # [osx]
    - cmake >=3.20
  host:
    # Pin the CPython build flavour explicitly.  Without this, conda-build
    # 26 can propagate its debug-Python variant into the test environment,
    # which is not published on the standard conda-forge channel.
    - python {{ PY_VER }}* *_cpython  # [py<313]
    - python {{ PY_VER }}* *_cp313    # [py==313]
    - python_abi 3.13.* *_cp313   # [py==313]
    - scikit-build-core ~=0.3
    - pybind11 ~=2.13
    - python-build ~=1.2
    - setuptools_scm[toml] ~=8.0
    - numpy >=2.0,<3
  run:
    - python {{ PY_VER }}* *_cpython  # [py<313]
    - python {{ PY_VER }}* *_cp313    # [py==313]
    - martinpdes::typedunit
    - matplotlib >=3.9,<4
    - numpy >=2.0,<3
    - pydantic >=2.8,<3
    - tabulate

about:
  home: https://github.com/MartinPdeS/PackLab
  license: MIT
  summary: "A package for particle packing simulation."
  description: "PackLab"
  dev_url: https://github.com/MartinPdeS/PackLab
  doc_url: https://martinpdes.github.io/PackLab/
  license_file: LICENSE
  keywords:
    - packing
    - particle
    - simulation

files:
  include:
    - "PackLab/*.so"
    - "PackLab/monte_carlo/*.so"
    - "PackLab/analytical/*.so"
  exclude:
    - "matlab/**"

test:
  imports:
    - PackLab
  requires:
    - pytest >=0.6
    - pytest-cov >=2.0
    - pytest-json-report ==1.5
    - coverage ==7.6
  commands:
    - python -m pytest
  source_files:
    - tests

extra:
  recipe-maintainers:
    - MartinPdeS
