# Simple workflow for deploying static content to GitHub Pages
name: Deploy coverage

on:
  push:
    branches: [ "master" ]
    tags: '*'
  pull_request:
    branches: [ "master" ]


# Sets permissions of the  GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:
  ManyLinux_x86_64:
    # Pinned to the reviewed MPSActions master commit; update intentionally.
    uses: MartinPdeS/MPSActions/.github/workflows/publish_coverage.yml@fae8d0cd3aeb1c98f05922a77a55ea277a3a068c
    with:
      python-version: "3.11"
      apt-package: xvfb
    secrets:
      _GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
