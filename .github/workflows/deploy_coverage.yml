# Simple workflow for deploying static content to GitHub Pages
name: Deploy coverage

on:
  push:
    branches: [ "master" ]
    tags: '*'
  pull_request:
    branches: [ "master" ]


# Sets permissions of the  GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  # The coverage action persists its report on python-coverage-comment-action-data.
  contents: write

jobs:
  ManyLinux_x86_64:
    # Receive backward-compatible updates from the MPSActions v1 release line.
    uses: MartinPdeS/MPSActions/.github/workflows/publish_coverage.yml@v1
    with:
      python-version: "3.11"
      apt-package: xvfb
      coverage-package: PackLab
    secrets:
      _GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
