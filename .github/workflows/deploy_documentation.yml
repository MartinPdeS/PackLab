# Simple workflow for deploying static content to GitHub Pages
name: Documentation

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Documentation builds for all branches, but only the master build publishes Pages.
concurrency:
  group: documentation-page-deployment
  cancel-in-progress: false

jobs:
  ManyLinux_x86_64:
    # Receive backward-compatible updates from the MPSActions v1 release line.
    uses: MartinPdeS/MPSActions/.github/workflows/publish_documentation.yml@v1
    with:
      python-version: "3.11"
      package-name: "PackLab"
      apt-package: xvfb jq
