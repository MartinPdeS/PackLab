# Simple workflow for deploying static content to GitHub Pages
name: Documentation

on:
  push:
    branches: [ "master" ]
    tags: '*'
  pull_request:
    branches: [ "master" ]


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ManyLinux_x86_64:
    # Pinned to the reviewed MPSActions master commit; update intentionally.
    uses: MartinPdeS/MPSActions/.github/workflows/publish_documentation.yml@fae8d0cd3aeb1c98f05922a77a55ea277a3a068c
    with:
      python-version: "3.11"
      package-name: "PackLab"
      apt-package: xvfb jq
