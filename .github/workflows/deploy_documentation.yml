# Simple workflow for deploying static content to GitHub Pages
name: Documentation

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Documentation builds for all branches and publishes master and release-tag versions.
concurrency:
  group: documentation-page-deployment
  cancel-in-progress: false

jobs:
  ManyLinux_x86_64:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_documentation.yml@v2
    with:
      python-version: "3.11"
      package-name: "PackLab"
      apt-package: xvfb jq
      deploy-pages: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
