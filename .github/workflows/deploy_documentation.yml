# Simple workflow for deploying static content to GitHub Pages
name: Documentation

on:
  push:
    branches: [ "master" ]
    tags: '*'
  pull_request:
    branches: [ "master" ]


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# A release push and its tag both publish to the same documentation_page branch:
# one updates ``latest`` and the other adds the versioned documentation.  Queue
# them so generated HTML and binary gallery assets are never rebased concurrently.
concurrency:
  group: documentation-page-deployment
  cancel-in-progress: false

jobs:
  ManyLinux_x86_64:
    # Receive backward-compatible updates from the MPSActions v1 release line.
    uses: MartinPdeS/MPSActions/.github/workflows/publish_documentation.yml@v1
    with:
      python-version: "3.11"
      package-name: "PackLab"
      apt-package: xvfb jq
