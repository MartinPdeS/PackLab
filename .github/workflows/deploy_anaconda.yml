name: Deploy Conda Packages

on:
  push:
    tags: [ "v*" ]

permissions:
    contents: write

jobs:
  ManyLinux_x86_64:
    # Pinned to the reviewed MPSActions master commit; update intentionally.
    uses: MartinPdeS/MPSActions/.github/workflows/publish_compiled_package_to_anaconda.yml@a2d08d2ce38e33ae98cb7399105ad40f32169376
    with:
      python_versions: '["3.11", "3.12", "3.13"]'
      apt_package: ""
      os_list: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      package_name: packlab
      test_import: PackLab
    secrets:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
