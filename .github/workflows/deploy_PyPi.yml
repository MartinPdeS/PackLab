name: Deploy to PyPi

on:
  push:
    tags: [ "v*" ]

permissions:
    contents: write

jobs:
  PyPi:
    # Receive backward-compatible updates from the MPSActions v1 release line.
    uses: MartinPdeS/MPSActions/.github/workflows/publish_compiled_package_to_PyPi.yml@v1
    with:
      python-version: "3.11"
      build-Linux: true
      build-macOS: true
      build-Windows: true
      mingw-package: |
        mingw-w64-x86_64-toolchain
        mingw-w64-x86_64-ninja
        mingw-w64-x86_64-gcc-fortran
        mingw-w64-x86_64-pkg-config
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
