name: Deploy to PyPi

on:
  push:
    tags: [ "v*" ]

permissions:
    contents: write

jobs:
  PyPi:
    # Pinned to the reviewed MPSActions master commit; update intentionally.
    uses: MartinPdeS/MPSActions/.github/workflows/publish_compiled_package_to_PyPi.yml@fae8d0cd3aeb1c98f05922a77a55ea277a3a068c
    with:
      python-version: "3.11"
      build-Linux: true
      build-macOS: true
      build-Windows: true
      mingw-package: |
        mingw-w64-x86_64-toolchain
        mingw-w64-x86_64-ninja
        mingw-w64-x86_64-gcc-fortran
        mingw-w64-x86_64-pkg-config
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
