name: Test wheel layout

on:
  pull_request:
  push:
    branches: [master]

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build cmake ninja pybind11 scikit-build-core setuptools-scm

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Verify native-extension layout and typing metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              members = set(archive.namelist())

          assert "PackLab/py.typed" in members
          assert "PackLab/samplers.pyi" in members
          assert "PackLab/monte_carlo/domain.pyi" in members
          assert "PackLab/analytical/solver.pyi" in members

          extensions = {
              member for member in members
              if member.startswith("PackLab/") and member.endswith(".so")
          }
          expected = {
              "PackLab/_unit_registry",
              "PackLab/samplers",
              "PackLab/monte_carlo/domain",
              "PackLab/monte_carlo/estimator",
              "PackLab/monte_carlo/result",
              "PackLab/monte_carlo/simulator",
              "PackLab/monte_carlo/statistics",
              "PackLab/analytical/domain",
              "PackLab/analytical/solver",
          }
          normalized = {
              re.sub(r"\.(cpython|abi)[^.]*\.so$", "", member)
              for member in extensions
          }
          assert normalized == expected, (normalized, expected)
          assert not any(member.startswith("PackLab/binary/") for member in members)
          PY
