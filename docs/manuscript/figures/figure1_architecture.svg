<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title description">
  <title id="title">PackLab analytical and numerical workflows</title>
  <desc id="description">The Percus-Yevick analytical workflow is shown first, followed by the random sequential addition and Metropolis Monte Carlo numerical workflows.</desc>
  <defs>
    <filter id="shadow" x="-0.02" y="-0.08" width="1.04" height="1.16"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/></filter>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1677b8"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16805a"/></marker>
    <style>.lane{font:700 25px Arial,sans-serif}.label{font:700 19px Arial,sans-serif;fill:#102a43}.detail{font:400 16px Arial,sans-serif;fill:#334e68}.small{font:600 14px Arial,sans-serif;fill:#526579;letter-spacing:.5px}</style>
  </defs>
  <rect width="1400" height="950" fill="#f8fafc"/>
  <!-- Boundary between the public Python API and native C++ kernels. -->
  <text x="687" y="31" text-anchor="end" class="small">PYTHON API</text>
  <text x="713" y="31" text-anchor="start" class="small">C++ CORE</text>
  <!-- Primary analytical workflow -->
  <rect x="55" y="45" width="1290" height="245" rx="22" fill="#e9f5ff" stroke="#b7ddf6" stroke-width="2"/>
  <text x="85" y="86" class="lane" fill="#0b5f93">ANALYTICAL WORKFLOW · Percus–Yevick</text>
  <g fill="white" stroke="#6399bc" stroke-width="2" filter="url(#shadow)"><rect x="80" y="115" width="255" height="140" rx="8"/><rect x="390" y="115" width="255" height="140" rx="8"/><rect x="755" y="115" width="255" height="140" rx="8"/><rect x="1065" y="115" width="255" height="140" rx="8"/></g>
  <text x="207" y="150" text-anchor="middle" class="label">Mixture specification</text><text x="207" y="184" text-anchor="middle" class="detail"><tspan x="207">Particle radii and fractions</tspan><tspan x="207" dy="26">Volume fraction</tspan><tspan x="207" dy="26">Real-space range</tspan></text>
  <text x="517" y="150" text-anchor="middle" class="label">Python interface</text><text x="517" y="184" text-anchor="middle" class="detail"><tspan x="517">PercusYevickDomain</tspan><tspan x="517" dy="26">PercusYevickSolver</tspan><tspan x="517" dy="26">Unit validation</tspan></text>
  <text x="882" y="150" text-anchor="middle" class="label">PY solver</text><text x="882" y="184" text-anchor="middle" class="detail"><tspan x="882">Mixture coefficients</tspan><tspan x="882" dy="26">Partial structure factors</tspan><tspan x="882" dy="26">Inverse radial transform</tspan></text>
  <text x="1192" y="150" text-anchor="middle" class="label">Analytical result</text><text x="1192" y="184" text-anchor="middle" class="detail"><tspan x="1192">Sᵢⱼ(k), hᵢⱼ(r), gᵢⱼ(r)</tspan><tspan x="1192" dy="26">Wavenumber grid</tspan><tspan x="1192" dy="26">Resolution diagnostic</tspan></text>
  <!-- RSA workflow -->
  <rect x="55" y="345" width="1290" height="245" rx="22" fill="#fff4df" stroke="#f4cf93" stroke-width="2"/>
  <text x="85" y="386" class="lane" fill="#a85c00">NUMERICAL WORKFLOW · Random sequential addition</text>
  <g fill="white" stroke="#d9a95c" stroke-width="2" filter="url(#shadow)"><rect x="80" y="415" width="255" height="140" rx="8"/><rect x="390" y="415" width="255" height="140" rx="8"/><rect x="755" y="415" width="255" height="140" rx="8"/><rect x="1065" y="415" width="255" height="140" rx="8"/></g>
  <text x="207" y="450" text-anchor="middle" class="label">RSA configuration</text><text x="207" y="484" text-anchor="middle" class="detail"><tspan x="207">Domain geometry</tspan><tspan x="207" dy="26">Radius distribution</tspan><tspan x="207" dy="26">Stopping criteria and seed</tspan></text>
  <text x="517" y="450" text-anchor="middle" class="label">Python interface</text><text x="517" y="484" text-anchor="middle" class="detail"><tspan x="517">PackingDomain</tspan><tspan x="517" dy="26">RSASimulator</tspan><tspan x="517" dy="26">PackingEstimator</tspan></text>
  <text x="882" y="450" text-anchor="middle" class="label">RSA engine</text><text x="882" y="484" text-anchor="middle" class="detail"><tspan x="882">Candidate insertion</tspan><tspan x="882" dy="26">Neighbour search</tspan><tspan x="882" dy="26">Overlap test and rejection</tspan></text>
  <text x="1192" y="450" text-anchor="middle" class="label">Packing result</text><text x="1192" y="484" text-anchor="middle" class="detail"><tspan x="1192">Sphere configuration</tspan><tspan x="1192" dy="26">Packing statistics</tspan><tspan x="1192" dy="26">Finite-sample correlations</tspan></text>
  <!-- Metropolis workflow -->
  <rect x="55" y="645" width="1290" height="245" rx="22" fill="#e8f7f0" stroke="#a8dec5" stroke-width="2"/>
  <text x="85" y="686" class="lane" fill="#126247">NUMERICAL WORKFLOW · Metropolis Monte Carlo</text>
  <g fill="white" stroke="#68ad8d" stroke-width="2" filter="url(#shadow)"><rect x="80" y="715" width="255" height="140" rx="8"/><rect x="390" y="715" width="255" height="140" rx="8"/><rect x="755" y="715" width="255" height="140" rx="8"/><rect x="1065" y="715" width="255" height="140" rx="8"/></g>
  <text x="207" y="750" text-anchor="middle" class="label">Initial configuration</text><text x="207" y="784" text-anchor="middle" class="detail"><tspan x="207">RSA or other valid positions</tspan><tspan x="207" dy="26">Fixed radii and classes</tspan><tspan x="207" dy="26">Periodic or wall domain</tspan></text>
  <text x="517" y="750" text-anchor="middle" class="label">Python interface</text><text x="517" y="784" text-anchor="middle" class="detail"><tspan x="517">MetropolisOptions</tspan><tspan x="517" dy="26">MetropolisSimulator</tspan><tspan x="517" dy="26">Move statistics</tspan></text>
  <text x="882" y="750" text-anchor="middle" class="label">Metropolis sampler</text><text x="882" y="784" text-anchor="middle" class="detail"><tspan x="882">Symmetric displacement</tspan><tspan x="882" dy="26">Hard-sphere acceptance</tspan><tspan x="882" dy="26">Configured sweeps</tspan></text>
  <text x="1192" y="750" text-anchor="middle" class="label">Equilibrium sample</text><text x="1192" y="784" text-anchor="middle" class="detail"><tspan x="1192">Relaxed configuration</tspan><tspan x="1192" dy="26">Acceptance rate</tspan><tspan x="1192" dy="26">Pair-correlation analysis</tspan></text>
  <path d="M700 45V890" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 8" opacity="0.8"/>
  <g fill="none" stroke="#1677b8" stroke-width="4" marker-end="url(#blue)"><path d="M335 185H375"/><path d="M645 185H740"/><path d="M1010 185H1050"/></g>
  <g fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#orange)"><path d="M335 485H375"/><path d="M645 485H740"/><path d="M1010 485H1050"/></g>
  <g fill="none" stroke="#16805a" stroke-width="4" marker-end="url(#green)"><path d="M335 785H375"/><path d="M645 785H740"/><path d="M1010 785H1050"/></g>
  <rect x="612" y="906" width="176" height="27" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="700" y="925" text-anchor="middle" class="small">PYTHON | C++ CORE</text>
</svg>
