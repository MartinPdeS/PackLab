[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11", "setuptools_scm[toml]>=8.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build-dir = ".skbuild/{wheel_tag}"
logging.level = "INFO"
wheel.exclude = ["PackLab/cpp", "matlab", "matlab/**"]
install.strip = false
sdist.exclude = [
    "tests",
    "docs",
    "matlab",
    "matlab/**",
    ".git*",
    "developments",
]

[tool.setuptools_scm]
write_to = "PackLab/_version.py"
version_scheme = "only-version"
local_scheme = "no-local-version"

[project]
name = "PackLab"
version = "0.6.7"
description = "Random Sequential Addition (RSA) particle packing with a fast C++ core."
license = "MIT"
readme = "README.rst"
requires-python = ">=3.10"
authors = [{name="Martin Poinsinet de Sivry-Houle", email="martin.poinsinet.de.sivry@gmail.com"}]
keywords = ["rsa", "packing", "particles", "spheres", "simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: C++",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.6.3",
    "matplotlib",
    "numpy",
    "TypedUnit",
    "tabulate"
]

[project.urls]
Homepage = "https://github.com/MartinPdeS/PackLab"
Repository = "https://github.com/MartinPdeS/PackLab"
Issues = "https://github.com/MartinPdeS/PackLab/issues"
Documentation = "https://martinpdes.github.io/PackLab/docs/latest/index.html"


[tool.setuptools.packages.find]
include = ["PackLab*"]

[tool.setuptools.package-data]
"PackLab" = ["py.typed", "*.pyi", "**/*.pyi"]


[project.optional-dependencies]
testing = [
    "pytest>=0.6",
    "pytest-cov>=2.0",
    "pytest-json-report==1.5.0",
    "flake8>=3.9",
    "coverage==7.13.5"
]

documentation = [
    "numpydoc==1.10.0",
    "sphinx>=5.1.1",
    "sphinx-gallery==0.20.0",
    "pydata-sphinx-theme==0.16.1",
    "sphinx-rtd-theme==3.1.0",
    "PyMieSim ==5.0.2",
]

scattering = [
    "PyMieSim ==5.0.2",
]

dev = [
    "flake==7.2.0",
]

[tool.cibuildwheel]
build-frontend = "build"
test-extras = ["testing"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
build = ["cp311-manylinux*", "cp312-manylinux*", "cp313-manylinux*"]
# Modern scientific Python dependencies no longer consistently publish
# manylinux2014 wheels.  Building on 2.28 lets cibuildwheel install those
# dependencies as wheels during its isolated test phase.
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
before-test = ""
test-command = "cd /tmp && python -m pytest --import-mode=importlib --config-file={project}/pytest.ini {project}/tests"

[tool.cibuildwheel.macos]
archs = ["arm64"]
build = ["cp311-*", "cp312-*", "cp313-*"]
repair-wheel-command = "delocate-wheel -w {dest_dir} -v {wheel}"  # --exclude=libomp.dylib
test-command = 'cd /tmp && python -m pytest --import-mode=importlib --config-file={project}/pytest.ini {project}/tests'  # DYLD_PRINT_LIBRARIES=NO

[tool.cibuildwheel.windows]
archs = ["AMD64"]
build = ["cp311-*", "cp312-*", "cp313-*"]
test-command = 'cd /d %TEMP% && python -m pytest --import-mode=importlib --config-file={project}/pytest.ini {project}/tests'
